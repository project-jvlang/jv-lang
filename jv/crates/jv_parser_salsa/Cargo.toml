[package]
name = "jv_parser_salsa"
version = "0.1.0"
edition = "2024"
authors = ["jv Language Team"]
license = "MIT OR Apache-2.0"
description = "Salsa-based incremental parser pipeline for the jv language"
publish = false
autobenches = false

[features]
bench-rss-probe = []

[dependencies]
salsa = "0.18"
petgraph = "0.6"
jv_lexer = { path = "../jv_lexer" }
jv_parser_frontend = { path = "../jv_parser_frontend" }
jv_parser_preprocess = { path = "../jv_parser_preprocess" }
jv_parser_semantics = { path = "../jv_parser_semantics" }
jv_ast = { path = "../jv_ast" }
jv_type_inference_java = { path = "../jv_type_inference_java" }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
jv_parser_rowan = { path = "../jv_parser_rowan" }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench_main"
harness = false
